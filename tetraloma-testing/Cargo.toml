[package]
name = "tetraloma-testing"
description = "Test support for tetraloma: the test device, test meshes, tolerances and the Python oracles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[features]
default = ["cpu"]
# Runtime features, forwarded to tetraloma-testing-base and cubecl (docs/design.md, "Cargo features").
cpu = ["cubecl/cpu", "tetraloma-testing-base/cpu"]
cuda = ["cubecl/cuda", "tetraloma-testing-base/cuda"]
hip = ["cubecl/hip", "tetraloma-testing-base/hip"]
vulkan = ["cubecl/vulkan", "tetraloma-testing-base/vulkan"]
metal = ["cubecl/metal", "tetraloma-testing-base/metal"]
metal-native = ["cubecl/metal-native", "tetraloma-testing-base/metal-native"]
wgpu = ["cubecl/wgpu", "tetraloma-testing-base/wgpu"]
# Forwards `mpi` to tetraloma and tetraloma-testing-base (docs/design.md, section 18; ADR-0028,
# ADR-0074, ADR-0078).
mpi = ["tetraloma/mpi", "tetraloma-testing-base/mpi"]

[dependencies]
cubecl.workspace = true
tetraloma = { path = "../tetraloma" }
tetraloma-testing-base = { path = "../tetraloma-testing-base", default-features = false }
tetraloma-device = { path = "../tetraloma-device", features = ["testing"] }
tetraloma-dims = { path = "../tetraloma-dims" }
tetraloma-geometry = { path = "../tetraloma-geometry", features = ["testing"] }
tetraloma-refcell = { path = "../tetraloma-refcell" }
# Exact float parsing: the oracles print f32 values that must compare bitwise.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[bin]]
# The binary box file of the M8 memory test (ADR-0035, rule 10):
# gen-gmsh-box N PATH writes cube_box(Tetrahedron, N, 1).
name = "gen-gmsh-box"

[dev-dependencies]
proptest.workspace = true

# The test files are modules of one test executable (tests/main.rs): one link of the
# dependencies instead of one per file (disk space and link time).
[[test]]
name = "integration"
path = "tests/main.rs"
