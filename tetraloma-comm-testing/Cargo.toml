[package]
name = "tetraloma-comm-testing"
description = "Host-only test support below the mesh: threaded communicator, communicator checks and rank-count guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# ThreadComm implements `CommDyn::raw`, which exists only under tetraloma-comm's `mpi`: turn
# this on whenever tetraloma-comm's `mpi` is on.
mpi = ["tetraloma-comm/mpi", "dep:mpi"]

[dependencies]
tetraloma-comm = { path = "../tetraloma-comm" }
mpi = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
