[package]
name = "tetraloma-testing-base"
description = "Device and parallel test support below the mesh: test client, tolerances and foundation checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["cpu"]
# Runtime features, each the cubecl feature of the same name (docs/design.md, "Cargo features").
cpu = ["cubecl/cpu"]
cuda = ["cubecl/cuda"]
hip = ["cubecl/hip"]
vulkan = ["cubecl/vulkan"]
metal = ["cubecl/metal"]
metal-native = ["cubecl/metal-native"]
wgpu = ["cubecl/wgpu"]
# ThreadComm implements `CommDyn::raw`, which exists only under tetraloma-comm's `mpi`: turn
# this on whenever MPI is enabled alongside tetraloma-testing-base.
mpi = ["tetraloma-comm-testing/mpi", "tetraloma-parallel/mpi", "dep:mpi"]

[dependencies]
cubecl.workspace = true
mpi = { workspace = true, optional = true }
tetraloma-comm-testing = { path = "../tetraloma-comm-testing" }
tetraloma-device = { path = "../tetraloma-device", features = ["testing"] }
tetraloma-parallel = { path = "../tetraloma-parallel" }
